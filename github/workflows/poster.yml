name: Авто-расклейка

on:
  schedule:
    - cron: '0 */6 * * *'   # 4 раза в день
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Установка зависимостей
        run: |
          pip install selenium requests webdriver-manager
          sudo apt-get update
          sudo apt-get install -y tor chromium-browser tesseract-ocr
          sudo service tor start
          
      - name: Запуск
        env:
          GIGACHAT_KEY: ${{ secrets.GIGACHAT_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
        run: |
          python poster.py
