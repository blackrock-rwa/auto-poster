name: One•Two•Three Расклейка

on:
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      # Используем проверенную версию checkout v3 (она еще работает)
      - name: Клонирование репозитория
        uses: actions/checkout@v3
      
      # Используем проверенную версию setup-python v4 (она еще работает)
      - name: Установка Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Установка зависимостей
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser chromium-chromedriver
          pip install --upgrade pip
          pip install selenium requests openai webdriver-manager
      
      - name: Запуск расклейки
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
        run: |
          python poster.py
      
      # Используем проверенную версию upload-artifact v3 (она тоже еще работает)
      - name: Сохранение статистики
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: poster-data
          path: |
            stats.json
            history.json
